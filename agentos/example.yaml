version: 1
project:
  name: example
  defaultBranch: main
models:
  standard:
    provider: local
    model: test-model
    inputMicrodollarsPerMillionTokens: 0
    outputMicrodollarsPerMillionTokens: 0
    runtimeMicrodollarsPerMinute: 0
  # Moonshot Kimi model profile. Uncomment and route an agent's `model` here
  # to run that role on the Kimi runtime (requires KIMI_API_KEY).
  # kimi:
  #   provider: kimi
  #   model: kimi-k2.7-code
  #   inputMicrodollarsPerMillionTokens: 0
  #   outputMicrodollarsPerMillionTokens: 0
  #   runtimeMicrodollarsPerMinute: 0
agents:
  specifier:
    model: standard
    environment: spec-env
    tools: []
    mcps: []
    retries: 0
    timeoutMs: 900000
  implementer:
    model: standard
    environment: default
    tools: []
    mcps: []
    retries: 0
    timeoutMs: 900000
  verifier:
    model: standard
    environment: sealed
    tools: [bash]
    mcps: []
    retries: 0
    timeoutMs: 900000
environments:
  spec-env:
    runtime: process
    variables: {}
    tools: []
    mcps: []
  default:
    runtime: process
    variables: {}
    tools: []
    mcps: []
  sealed:
    runtime: process
    variables: {}
    tools: []
    mcps: []
pipelines:
  feature:
    # The three steps a feature run needs. A project may also declare
    # `planning` (before implementation) and `review` (after verification,
    # advisory, never blocking); see docs/architecture/durable-feature-workflow.md.
    steps:
      - id: specification
        agent: specifier
      - id: implementation
        agent: implementer
      - id: verification
        agent: verifier
policies:
  protectedPaths:
    - .github/workflows/**
    - CODEOWNERS
    - '**/CODEOWNERS'
    - .gitmodules
    - .env*
    - '**/.env*'
    - agentos/**
  allowBinary: false
  allowSymlinks: false
  maxFileBytes: 1000000
  tools:
    allow: []
    deny: []
  mcp:
    allow: []
    deny: []
budgets:
  workflowMicrodollars: 1000000
  dailyMicrodollars: 10000000
  concurrency: 2
  admissionReservePercent: 80
goals:
  maxSteps: 3
  maxRetries: 2
  timeoutMs: 3600000
runtime:
  provider: managed
  # Replace the line below with `routing: { kimi: kimi }` to route the `kimi`
  # model-profile provider (see the commented `kimi` model above) onto the
  # `kimi` runtime; every other provider stays on `managed`. The verification
  # role may not route to `kimi` -- composition rejects that config.
  routing: {}
